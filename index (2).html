<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#172454" />

  <title>LTS | مركزك للإنجليزية بثقة</title>
  <style>
/* LTS English Learning Center - الأنماط الرئيسية */
@import url("https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap");

:root {
  --ink: #101424;
  --ink-soft: #4f566a;
  --navy: #172454;
  --blue: #3569ee;
  --blue-dark: #2246b7;
  --mint: #13cba1;
  --mint-soft: #e4fbf5;
  --paper: #ffffff;
  --surface: #f6f8fc;
  --line: #e5e8f0;
  --radius: 20px;
  --shadow: 0 22px 60px rgba(25, 40, 84, .10);
  --font-ar: "Nunito", "Baloo Bhaijaan 2", sans-serif;
  --font-en: "Nunito", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ar); }
button, a { -webkit-tap-highlight-color: transparent; }
button { font: inherit; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

.lts-app, body > .lts-app { min-height: 100vh; overflow: hidden; background: #fff; }
.shell { width: min(1180px, calc(100% - 64px)); margin: 0 auto; }

.announcement-bar { background: var(--navy); color: #fff; font-size: 12px; }
.announcement-inner { min-height: 38px; display: flex; align-items: center; justify-content: center; gap: 9px; position: relative; }
.announcement-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(19, 203, 161, .15); }
.announcement-link { border: 0; background: transparent; color: #99f2dd; display: inline-flex; gap: 4px; align-items: center; font-size: 11px; margin-inline-start: 13px; }
.announcement-link svg { transform: scaleX(-1); }

.site-header { position: relative; z-index: 20; background: rgba(255,255,255,.92); border-bottom: 1px solid rgba(229,232,240,.8); backdrop-filter: blur(14px); }
.nav-inner { min-height: 84px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.brand-word { font: 900 40px/1 "Nunito", var(--font-en); color: #1fa1ff; letter-spacing: -.01em; }
.brand-sub { font: 900 13px/1 "Nunito", var(--font-en); color: #1fa1ff; margin-bottom: 7px; white-space: nowrap; }
.brand { display: inline-flex; align-items: flex-end; gap: 4px; direction: ltr; }
.main-nav { display: flex; align-items: center; gap: 31px; color: var(--ink-soft); font-size: 13px; font-weight: 600; flex: 1; justify-content: center; }
.main-nav a { position: relative; transition: color .2s ease; }
.main-nav a:first-child, .main-nav a:hover { color: var(--blue); }
.main-nav a:first-child::after { content: ""; position: absolute; bottom: -11px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--mint); }
.nav-actions { display: flex; align-items: center; gap: 10px; }
.language-switch, .mobile-language { background: transparent; border: 0; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px; font: 600 12px var(--font-en); }
.mobile-language, .menu-toggle { display: none; }
.nav-cta { border-radius: 11px; background: var(--ink); color: #fff; border: 0; height: 42px; padding: 0 19px; font-size: 12px; font-weight: 700; box-shadow: 0 9px 18px rgba(16,20,36,.14); }
.nav-cta:hover { background: var(--blue); }

.hero-section { background: linear-gradient(180deg, #f8fbff 0%, #f5f8ff 100%); min-height: 580px; position: relative; isolation: isolate; }
.hero-section::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(53,105,238,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(53,105,238,.035) 1px, transparent 1px); background-size: 64px 64px; mask-image: linear-gradient(90deg, black, transparent 80%); z-index: -2; }
.hero-orbit { position: absolute; border: 1px solid rgba(53,105,238,.12); border-radius: 50%; z-index: -1; }
.hero-orbit-one { width: 680px; height: 680px; left: -380px; bottom: -395px; }
.hero-orbit-two { width: 470px; height: 470px; right: -240px; top: 60px; border-color: rgba(19,203,161,.15); }
.hero-grid { min-height: 580px; display: grid; grid-template-columns: 1fr .9fr; align-items: center; gap: 70px; padding: 70px 0 74px; }
.hero-content { max-width: 580px; }
.eyebrow { color: var(--blue); font: 700 11px var(--font-en); letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.eyebrow svg { color: var(--mint); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: clamp(48px, 6vw, 82px); line-height: .98; letter-spacing: -.065em; margin: 22px 0 24px; font-weight: 800; color: var(--ink); }
h1 span, h2 span { display: block; }
.hero-body { color: var(--ink-soft); max-width: 480px; line-height: 1.95; font-size: 16px; }
.hero-actions { display: flex; align-items: center; gap: 25px; margin-top: 30px; }
.button-primary, .button-light { border: 0; height: 50px; padding: 0 22px; border-radius: 13px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 13px; }
.button-primary { background: var(--blue); color: #fff; box-shadow: 0 13px 24px rgba(53,105,238,.24); }
.button-primary:hover { background: var(--blue-dark); transform: translateY(-1px); }
.button-primary svg, .button-light svg, .arrow-link svg, .course-link svg { transform: scaleX(-1); }
.text-action { color: var(--ink); border: 0; background: none; display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; padding: 0; }
.play-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); display: inline-flex; align-items: center; justify-content: center; }
.play-icon svg { margin-inline-start: 2px; }
.social-proof { display: flex; align-items: center; gap: 12px; margin-top: 44px; }
.avatar-stack { display: flex; direction: ltr; }
.avatar-stack span { width: 29px; height: 29px; border-radius: 50%; border: 2px solid #f8fbff; background: #d4e1ff; color: var(--navy); display: grid; place-items: center; font: 700 8px var(--font-en); margin-left: -8px; }
.avatar-stack span:nth-child(2) { background: #fee3d1; }
.avatar-stack span:nth-child(3) { background: #d3f4e8; }
.avatar-stack span:nth-child(4) { background: var(--navy); color: #fff; margin-left: -8px; width: 37px; }
.stars { color: #f5b93f; letter-spacing: 2px; font-size: 11px; }
.social-proof p { color: var(--ink-soft); font-size: 11px; line-height: 1.5; max-width: 245px; }
.hero-visual { position: relative; max-width: 500px; justify-self: end; width: 100%; }
.hero-photo-frame { width: min(100%, 460px); aspect-ratio: .92; border-radius: 32px 32px 120px 32px; overflow: hidden; position: relative; box-shadow: var(--shadow); margin: 0 auto; background: #dfe9ff; }
.hero-photo-frame::after { content: ""; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.6); border-radius: inherit; }
.hero-photo-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
.hero-photo-wash { position: absolute; inset: 0; background: linear-gradient(150deg, rgba(19,203,161,.14), transparent 38%, rgba(23,36,84,.35)); }
.hero-card { position: absolute; background: rgba(255,255,255,.94); backdrop-filter: blur(9px); border-radius: 14px; box-shadow: 0 13px 30px rgba(23,36,84,.16); z-index: 2; }
.hero-card-top { top: 32px; inset-inline-start: -22px; padding: 12px 15px 12px 11px; display: grid; grid-template-columns: 32px auto; column-gap: 9px; align-items: center; min-width: 149px; }
.hero-card-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--mint-soft); color: #0aa781; grid-row: span 2; }
.hero-card strong { font: 800 20px var(--font-en); line-height: 1; }
.hero-card small { color: var(--ink-soft); font-size: 9px; margin-top: 4px; }
.hero-card-bottom { bottom: 22px; inset-inline-end: -25px; padding: 10px 14px; display: flex; gap: 9px; align-items: center; min-width: 230px; }
.mini-avatar, .person-avatar { display: grid; place-items: center; border-radius: 50%; background: var(--navy); color: #fff; font: 700 9px var(--font-en); }
.mini-avatar { width: 30px; height: 30px; background: #f2b69b; }
.hero-card-bottom strong, .hero-card-bottom small { display: block; }
.hero-card-bottom strong { font: 700 10px var(--font-ar); }
.hero-card-bottom small { font-size: 9px; }
.hero-card-bottom > svg { color: var(--mint); margin-inline-start: auto; }
.hero-sticker { width: 108px; height: 108px; border-radius: 50%; background: var(--mint); color: var(--navy); display: grid; place-content: center; justify-items: center; gap: 5px; position: absolute; bottom: -28px; inset-inline-start: -39px; transform: rotate(-12deg); font-size: 10px; font-weight: 700; text-align: center; box-shadow: 0 12px 22px rgba(19,203,161,.25); }

.stats-section { background: #fff; border-bottom: 1px solid var(--line); }
.stats-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); align-items: center; min-height: 148px; }
.stats-intro { padding-inline-end: 30px; border-inline-end: 1px solid var(--line); }
.stats-kicker { color: var(--blue); font: 700 10px var(--font-en); letter-spacing: .15em; }
.stats-intro p { font-size: 12px; margin-top: 9px; color: var(--ink-soft); }
.stat-item { padding: 0 28px; border-inline-end: 1px solid var(--line); }
.stat-item:last-child { border: 0; }
.stat-item strong { font: 800 30px var(--font-en); letter-spacing: -.05em; display: block; }
.stat-item strong span { color: var(--mint); font-size: 18px; }
.stat-item small { display: block; color: var(--ink-soft); font-size: 11px; margin-top: 5px; }

.section { padding: 126px 0; }
.centered-heading { text-align: center; }
.centered-heading .eyebrow { justify-content: center; }
.section-heading h2 { font-size: clamp(35px, 4vw, 53px); line-height: 1.06; letter-spacing: -.06em; margin: 16px 0 13px; }
.section-heading p { color: var(--ink-soft); font-size: 15px; line-height: 1.85; }
.category-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin-top: 39px; }
.category-pill { border: 1px solid var(--line); background: #fff; color: var(--ink-soft); height: 39px; border-radius: 100px; padding: 0 19px; font-size: 12px; font-weight: 600; transition: all .2s ease; }
.category-pill:hover, .category-pill.active { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 8px 18px rgba(23,36,84,.14); }
.course-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 38px; }
.course-card { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: #fff; transition: transform .25s ease, box-shadow .25s ease; }
.course-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
.course-image-wrap { height: 192px; position: relative; overflow: hidden; background: #eff3fa; }
.course-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.course-card:hover .course-image-wrap img { transform: scale(1.04); }
.course-image-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,20,55,.06), rgba(12,20,55,.42)); }
.course-badge { position: absolute; top: 14px; inset-inline-start: 14px; color: var(--navy); border-radius: 7px; padding: 6px 9px; font-size: 10px; font-weight: 700; }
.course-play { width: 36px; height: 36px; position: absolute; bottom: 14px; inset-inline-end: 14px; border: 0; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; box-shadow: 0 6px 13px rgba(0,0,0,.18); }
.course-play svg { margin-inline-start: 2px; }
.course-body { padding: 18px 18px 20px; }
.course-meta { color: #9097a8; font: 500 10px var(--font-en); display: flex; justify-content: space-between; direction: ltr; }
.course-body h3 { font-size: 19px; letter-spacing: -.04em; margin-top: 11px; }
.course-body p { color: var(--ink-soft); font-size: 12px; line-height: 1.8; min-height: 42px; margin-top: 8px; }
.course-link, .arrow-link { background: none; border: 0; color: var(--blue); display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; padding: 0; margin-top: 17px; }
.course-link:hover, .arrow-link:hover { color: var(--blue-dark); }
.empty-state { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 18px; }

.method-section { background: var(--surface); }
.method-grid { display: grid; grid-template-columns: 1fr .9fr; gap: 100px; align-items: center; }
.method-visual { position: relative; padding: 0 0 26px 28px; }
.method-photo { height: 445px; border-radius: 26px 26px 26px 110px; overflow: hidden; position: relative; }
.method-photo img { width: 100%; height: 100%; object-fit: cover; }
.method-overlay { position: absolute; inset: 0; background: linear-gradient(140deg, rgba(19,203,161,.18), rgba(23,36,84,.24)); }
.method-note { position: absolute; bottom: -2px; inset-inline-start: -4px; background: var(--navy); color: #fff; padding: 17px 21px; border-radius: 13px; display: flex; align-items: center; gap: 14px; font-size: 11px; box-shadow: 0 12px 25px rgba(23,36,84,.19); }
.note-number { color: var(--mint); font: 800 27px var(--font-en); }
.floating-label { position: absolute; top: 31px; inset-inline-end: -31px; background: #fff; border-radius: 11px; padding: 10px 13px; display: flex; align-items: center; gap: 7px; font-size: 10px; box-shadow: 0 10px 25px rgba(23,36,84,.12); color: var(--navy); }
.floating-label svg { color: var(--mint); }
.method-content { max-width: 440px; }
.method-content h2 { font-size: clamp(40px, 5vw, 62px); line-height: 1.02; letter-spacing: -.07em; margin: 18px 0 24px; }
.method-content > p { color: var(--ink-soft); font-size: 15px; line-height: 1.95; }
.method-list { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; }
.method-list li { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 600; }
.method-list li span { background: var(--mint-soft); color: var(--mint); width: 23px; height: 23px; border-radius: 50%; display: grid; place-items: center; }

.featured-section { background: #fff; }
.split-heading { display: flex; justify-content: space-between; align-items: end; }
.split-heading .arrow-link { margin: 0 0 5px; }
.featured-grid { display: grid; grid-template-columns: 1.1fr .95fr .95fr; gap: 20px; margin-top: 42px; }
.course-card-featured:first-child { grid-row: span 2; }
.course-card-featured:first-child .course-image-wrap { height: 300px; }
.course-card-featured:first-child .course-body h3 { font-size: 24px; }
.course-card-featured:first-child .course-body p { max-width: 360px; }

.stories-section { background: var(--navy); color: #fff; position: relative; overflow: hidden; }
.stories-section::before { content: ""; position: absolute; width: 700px; height: 700px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); left: -300px; top: -400px; }
.stories-section .eyebrow { color: var(--mint); }
.stories-section .section-heading p { color: #bac4e4; }
.story-card { max-width: 1000px; margin: 48px auto 0; min-height: 250px; border: 1px solid rgba(255,255,255,.15); border-radius: 22px; padding: 37px 45px; display: grid; grid-template-columns: 80px 1fr auto; align-items: center; gap: 24px; background: rgba(255,255,255,.04); position: relative; }
.quote-mark { color: var(--mint); align-self: start; }
.story-quote .stars { margin-bottom: 16px; }
.story-quote blockquote { font-size: clamp(20px, 2.5vw, 28px); line-height: 1.6; letter-spacing: -.03em; margin: 0; max-width: 700px; font-weight: 500; }
.story-person { margin-top: 25px; display: flex; align-items: center; gap: 10px; }
.person-avatar { width: 35px; height: 35px; background: var(--mint); color: var(--navy); }
.story-person strong, .story-person small { display: block; }
.story-person strong { font-size: 12px; }
.story-person small { color: #97a4cd; font-size: 10px; margin-top: 3px; }
.story-controls { display: flex; flex-direction: column; align-items: center; gap: 17px; color: #aab5d9; font: 600 11px var(--font-en); }
.story-controls i { font-style: normal; color: #68749a; margin: 0 4px; }
.story-controls button { width: 35px; height: 35px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; background: transparent; color: #fff; display: grid; place-items: center; }
.story-controls button:hover { background: var(--mint); color: var(--navy); border-color: var(--mint); }

.faq-section { background: var(--surface); }
.faq-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 110px; align-items: start; }
.faq-intro h2 { font-size: clamp(38px, 4.5vw, 59px); line-height: 1.04; letter-spacing: -.07em; margin: 19px 0 22px; }
.faq-intro p { color: var(--ink-soft); line-height: 1.8; font-size: 13px; }
.faq-intro .text-action { margin-top: 23px; color: var(--blue); }
.faq-list { border-top: 1px solid var(--line); }
.faq-item { border-bottom: 1px solid var(--line); }
.faq-item button { border: 0; background: transparent; width: 100%; min-height: 72px; display: flex; justify-content: space-between; align-items: center; gap: 18px; text-align: start; color: var(--ink); font-size: 15px; font-weight: 700; padding: 0; }
.faq-item button svg { transition: transform .25s; color: var(--blue); flex-shrink: 0; }
.faq-item.open button svg { transform: rotate(180deg); }
.faq-item p { color: var(--ink-soft); font-size: 13px; line-height: 1.9; max-width: 620px; padding: 0 0 22px; }

.final-cta-section { background: var(--mint); color: var(--navy); }
.final-cta-inner { min-height: 260px; display: grid; grid-template-columns: 52px 1fr auto; gap: 22px; align-items: center; }
.cta-sparkle { width: 48px; height: 48px; display: grid; place-items: center; border: 1px solid rgba(23,36,84,.22); border-radius: 14px; transform: rotate(-9deg); }
.final-cta-inner .eyebrow { color: var(--navy); }
.final-cta-inner h2 { font-size: clamp(35px, 4.2vw, 55px); letter-spacing: -.065em; margin: 10px 0 7px; }
.final-cta-inner p { font-size: 14px; color: rgba(23,36,84,.72); }
.button-light { background: var(--navy); color: #fff; height: 52px; }
.button-light:hover { background: #fff; color: var(--navy); }

.site-footer { background: #fff; }
.footer-grid { min-height: 170px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px; }
.footer-brand p { color: var(--ink-soft); font-size: 12px; margin-top: 17px; }
.footer-links { display: flex; gap: 27px; color: var(--ink-soft); font-size: 12px; font-weight: 600; }
.footer-links a:hover { color: var(--blue); }
.footer-meta { justify-self: end; display: flex; flex-direction: column; align-items: end; gap: 7px; color: #9aa1b0; font-size: 10px; }
.toast-message { position: fixed; z-index: 50; bottom: 24px; inset-inline-start: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; border: 1px solid rgba(255,255,255,.15); box-shadow: 0 12px 30px rgba(16,20,36,.22); border-radius: 13px; padding: 13px 18px; display: flex; align-items: center; gap: 9px; font-size: 12px; animation: toast-in .28s ease-out; }
.toast-message svg { color: var(--mint); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }

@media (max-width: 900px) {
  .shell { width: min(100% - 40px, 680px); }
  .nav-inner { min-height: 74px; }
  .main-nav { gap: 17px; }
  .main-nav a { font-size: 11px; }
  .nav-cta { padding: 0 13px; font-size: 11px; }
  .hero-grid { grid-template-columns: 1fr .8fr; gap: 28px; padding: 58px 0; }
  h1 { font-size: 58px; }
  .hero-body { font-size: 14px; }
  .hero-card-top { inset-inline-start: -8px; }
  .hero-card-bottom { inset-inline-end: -8px; }
  .stats-grid { grid-template-columns: 1.1fr repeat(3, 1fr); }
  .stats-intro { padding-inline-end: 15px; }
  .stat-item { padding: 0 15px; }
  .method-grid { gap: 45px; }
  .faq-grid { gap: 45px; }
  .story-card { padding: 30px; }
}

@media (max-width: 680px) {
  .shell { width: min(100% - 32px, 520px); }
  .announcement-inner { text-align: center; font-size: 10px; min-height: 42px; }
  .announcement-link { display: none; }
  .nav-inner { min-height: 68px; }
  .main-nav { display: none; position: absolute; top: 68px; inset-inline: 0; background: #fff; padding: 21px 20px 24px; border-bottom: 1px solid var(--line); box-shadow: 0 15px 25px rgba(16,20,36,.08); flex-direction: column; align-items: stretch; gap: 0; }
  .main-nav.is-open { display: flex; }
  .main-nav a { padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .main-nav a:first-child::after { display: none; }
  .mobile-language { display: flex; padding-top: 16px; }
  .language-switch, .nav-cta { display: none; }
  .menu-toggle { display: grid; place-items: center; background: transparent; border: 0; color: var(--ink); width: 38px; height: 38px; }
  .hero-section { min-height: 0; }
  .hero-grid { display: flex; flex-direction: column; padding: 55px 0 78px; gap: 43px; align-items: stretch; }
  .hero-content { text-align: center; }
  .eyebrow { justify-content: center; }
  h1 { font-size: clamp(48px, 15vw, 68px); margin-top: 18px; }
  .hero-body { margin: auto; font-size: 13px; line-height: 1.9; }
  .hero-actions { justify-content: center; gap: 16px; flex-wrap: wrap; }
  .button-primary { height: 48px; }
  .social-proof { justify-content: center; margin-top: 31px; text-align: start; }
  .hero-visual { max-width: 420px; margin: 0 auto; }

/* LTS refresh: light-blue identity, text-led course covers, and sourced social proof */
:root {
  --blue: #76c4ff;
  --blue-dark: #2b8cde;
  --navy: #13204d;
  --mint: #19cfa6;
}
.nav-cta { background: var(--blue); color: var(--navy); }
.nav-cta:hover { background: var(--blue-dark); color: #fff; }
.button-primary { background: var(--blue); color: var(--navy); box-shadow: 0 13px 24px rgba(118,196,255,.28); }
.button-primary:hover { background: var(--blue-dark); color: #fff; }
.eyebrow, .course-link, .arrow-link, .faq-intro .text-action { color: var(--blue-dark); }
.category-pill:hover, .category-pill.active { background: var(--navy); border-color: var(--navy); }
.hero-section { background: linear-gradient(180deg, #f8fcff 0%, #edf8ff 100%); }
.hero-section::before { background-image: linear-gradient(rgba(118,196,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(118,196,255,.08) 1px, transparent 1px); }

.course-image-wrap { background: linear-gradient(135deg, var(--course-accent, #dcefff), #f6fbff 72%); }
.course-cover-grid { position: absolute; inset: 0; opacity: .5; background-image: linear-gradient(rgba(19,32,77,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(19,32,77,.07) 1px, transparent 1px); background-size: 26px 26px; }
.course-cover-grid::after { content: ""; width: 220px; height: 220px; border: 1px solid rgba(19,32,77,.12); border-radius: 50%; position: absolute; top: -104px; inset-inline-end: -74px; box-shadow: 0 0 0 24px rgba(255,255,255,.2), 0 0 0 48px rgba(255,255,255,.18); }
.course-cover-brand { position: absolute; inset-inline-start: 17px; top: 18px; display: flex; align-items: baseline; gap: 7px; color: var(--navy); direction: ltr; }
.course-cover-brand span { font: 800 30px var(--font-en); letter-spacing: -.09em; color: var(--blue-dark); }
.course-cover-brand small { font: 700 9px var(--font-en); letter-spacing: .08em; opacity: .6; }
.course-cover-title { position: absolute; inset-inline-start: 19px; bottom: 22px; color: var(--navy); font: 700 11px var(--font-en); letter-spacing: .1em; text-transform: uppercase; }
.course-cover-title strong { display: block; font-family: var(--font-ar); font-size: 19px; letter-spacing: -.04em; text-transform: none; margin-top: 5px; }
[dir="ltr"] .course-cover-title strong { font-family: var(--font-en); }

.stories-section { background: var(--navy); }
.review-panel { max-width: 1000px; margin: 48px auto 0; min-height: 250px; border: 1px solid rgba(255,255,255,.15); border-radius: 22px; padding: 38px 45px; display: grid; grid-template-columns: 65px 1fr 210px; align-items: center; gap: 28px; background: linear-gradient(135deg, rgba(118,196,255,.16), rgba(255,255,255,.035)); }
.review-google-mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 16px; background: #fff; color: #4285f4; font: 800 30px var(--font-en); box-shadow: 0 10px 24px rgba(0,0,0,.14); }
.review-panel-copy h3 { font-size: 23px; letter-spacing: -.04em; margin: 11px 0 9px; }
.review-panel-copy p { color: #b8c5e6; font-size: 13px; line-height: 1.8; max-width: 550px; }
.button-google { margin-top: 18px; border: 1px solid rgba(118,196,255,.45); border-radius: 10px; color: var(--blue); padding: 10px 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; }
.button-google svg { transform: scaleX(-1); }
.button-google:hover { background: var(--blue); color: var(--navy); }
.social-counts { border-inline-start: 1px solid rgba(255,255,255,.14); padding-inline-start: 25px; display: grid; gap: 17px; }
.social-counts a { display: flex; align-items: center; gap: 10px; color: #fff; }
.social-counts strong, .social-counts small { display: block; }
.social-counts strong { font: 800 21px var(--font-en); letter-spacing: -.05em; }
.social-counts small { color: #a6b4d7; font-size: 10px; margin-top: 2px; }
.social-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font: 800 18px var(--font-en); }
.social-icon.facebook { background: #1877f2; }
.social-icon.instagram { background: linear-gradient(135deg, #f9ce34, #ee2a7b 52%, #6228d7); }
.button-light { background: var(--navy); }
@media (max-width: 680px) {
  .review-panel { grid-template-columns: 1fr; gap: 16px; text-align: center; padding: 30px 22px; }
  .review-google-mark { margin: auto; }
  .review-panel-copy .stars { text-align: center; }
  .review-panel-copy h3 { font-size: 20px; }
  .review-panel-copy p { margin: auto; }
  .button-google { margin-inline: auto; }
  .social-counts { border-inline-start: 0; border-top: 1px solid rgba(255,255,255,.14); padding: 20px 0 0; grid-template-columns: 1fr 1fr; text-align: start; }
}

.developer-credit { color: var(--blue-dark); font-family: var(--font-en); font-weight: 700; letter-spacing: .04em; }

/* ---------- إضافات صغيرة بعد التحويل من React ---------- */
button, .button-google, .button-light { cursor: pointer; }
.toast-message[hidden] { display: none; }
.nav-cta, .button-primary { font-family: inherit; }

/* ---------- شريط الكوكيز السفلي ---------- */
.cookie-bar { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; background: #fff; color: var(--ink); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgba(16,20,36,.14); }
.cookie-bar[hidden], .cookie-panel[hidden] { display: none !important; }
.cookie-inner { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 18px 0; display: flex; align-items: center; gap: 28px; }
.cookie-text { flex: 1; font-size: 13px; line-height: 1.8; color: var(--ink); }
.cookie-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.cookie-btn { font-family: inherit; font-size: 13px; font-weight: 700; height: 44px; padding: 0 22px; border-radius: 6px; border: 2px solid var(--navy); background: var(--navy); color: #fff; white-space: nowrap; transition: background .2s ease, color .2s ease; }
.cookie-btn:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.cookie-outline { background: #fff; color: var(--navy); }
.cookie-outline:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
.cookie-close { border: 0; background: transparent; color: var(--ink); width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0; }
.cookie-close:hover { color: var(--blue-dark); }
.cookie-panel { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 0 0 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 28px; border-top: 1px solid var(--line); padding-top: 14px; }
.cookie-panel label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.cookie-panel input { width: 17px; height: 17px; accent-color: var(--navy); }
.cookie-panel .cookie-btn { height: 40px; margin-inline-start: auto; }
.cookie-bar:not([hidden]) ~ .toast-message { bottom: 120px; }

@media (max-width: 820px) {
  .cookie-inner { flex-wrap: wrap; gap: 14px; padding: 16px 0; position: relative; }
  .cookie-text { flex-basis: 100%; padding-inline-end: 36px; font-size: 12px; }
  .cookie-close { position: absolute; top: 10px; inset-inline-end: 0; }
  .cookie-actions { flex-basis: 100%; flex-wrap: wrap; }
  .cookie-btn { flex: 1; padding: 0 12px; font-size: 12px; height: 42px; }
  .cookie-panel .cookie-btn { flex: none; margin-inline-start: 0; }
  .cookie-bar:not([hidden]) ~ .toast-message { bottom: 190px; }
}

/* ---------- الفوتر الجديد (3 أعمدة) ---------- */
.site-footer { background: #f4f6fa; border-top: 1px solid var(--line); }
.footer-cols { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 64px; padding: 64px 0 48px; align-items: start; }
.footer-title { font-size: 15px; font-weight: 800; color: var(--ink); padding-bottom: 12px; margin: 28px 0 16px; border-bottom: 1px solid #d9deea; }
.footer-about .brand { margin-bottom: 6px; }
.footer-about .footer-title:first-of-type { margin-top: 22px; }
.footer-col > .footer-title:first-child { margin-top: 0; }
.footer-text { color: var(--ink-soft); font-size: 12.5px; line-height: 2; }
.footer-link-list, .footer-contact { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.footer-link-list a { color: var(--ink); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; transition: color .2s ease; }
.footer-link-list a:hover, .footer-contact a:hover { color: var(--blue-dark); }
.ext-icon { opacity: .7; flex-shrink: 0; }
.footer-contact li { display: flex; align-items: flex-start; gap: 10px; color: var(--ink-soft); font-size: 12.5px; line-height: 1.8; }
.footer-contact li svg { color: var(--blue-dark); margin-top: 4px; flex-shrink: 0; }
.footer-contact a { color: var(--ink); font-weight: 700; }
.footer-contact .contact-details { padding-top: 4px; }
.footer-contact .contact-details a { color: var(--blue-dark); display: inline-flex; align-items: center; gap: 7px; }
.footer-social { display: flex; gap: 14px; }
.footer-social a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1px solid #d9deea; background: #fff; color: var(--ink); transition: all .2s ease; }
.footer-social a:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
.footer-bottom { border-top: 1px solid #d9deea; background: #eceff6; }
.footer-bottom-inner { min-height: 56px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; color: #7d8496; font-size: 11px; }
body:has(.cookie-bar:not([hidden])) .site-footer { padding-bottom: 110px; }

@media (max-width: 900px) {
  .footer-cols { grid-template-columns: 1fr 1fr; gap: 44px 40px; }
  .footer-about { grid-column: 1 / -1; }
}
@media (max-width: 680px) {
  .footer-cols { grid-template-columns: 1fr; padding: 44px 0 32px; }
  .footer-bottom-inner { justify-content: center; text-align: center; flex-direction: column; padding: 14px 0; }
}

/* ---------- 5) الحالة العامة ---------- */
const state = { lang: "ar", category: "all", openFaq: 0 };
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const t = () => TEXT[state.lang];

/* بيجيب قيمة زي "nav.2" من الكائن */
const lookup = (key) => key.split(".").reduce((obj, k) => (obj ? obj[k] : undefined), t());

/* ---------- 6) الرسم (Render) ---------- */
const arrowIcon = (size) => `<svg width="${size}" height="${size}"><use href="#i-arrow"/></svg>`;

function courseCard(course, featured = false) {
  const L = state.lang;
  return `
    <article class="course-card ${featured ? "course-card-featured" : ""}">
      <div class="course-image-wrap" style="--course-accent:${course.accent}">
        <div class="course-cover-grid"></div>
        <div class="course-cover-brand"><span>LTS</span><small>${course.code}</small></div>
        <div class="course-cover-title">${t().startHere}<strong>${course.title[L]}</strong></div>
        <span class="course-badge" style="background-color:${course.accent}">${course.level[L]}</span>
        <button class="course-play" type="button" aria-label="${t().preview}"><svg width="14" height="14"><use href="#i-play"/></svg></button>
      </div>
      <div class="course-body">
        <div class="course-meta"><span>${course.students} ${t().learners}</span><span>${course.hours} ${t().hours}</span></div>
        <h3>${course.title[L]}</h3>
        <p>${course.description[L]}</p>
        <button type="button" class="course-link js-cta">${t().more}${arrowIcon(15)}</button>
      </div>
    </article>`;
}

function renderCourses() {
  const list = state.category === "all" ? COURSES : COURSES.filter((c) => c.category === state.category);
  $("#courseGrid").innerHTML = list.length
    ? list.map((c) => courseCard(c)).join("")
    : `<div class="empty-state">${t().noResults}</div>`;
  $("#featuredGrid").innerHTML = COURSES.filter((c) => c.featured).map((c) => courseCard(c, true)).join("");
}

function renderCategories() {
  $("#categoryRow").innerHTML = Object.keys(CATEGORIES)
    .map((key) => `<button type="button" role="tab" aria-selected="${state.category === key}" class="category-pill ${state.category === key ? "active" : ""}" data-category="${key}">${CATEGORIES[key][state.lang]}</button>`)
    .join("");
}

function renderFaqs() {
  $("#faqList").innerHTML = FAQS.map((f, i) => `
    <div class="faq-item ${state.openFaq === i ? "open" : ""}">
      <button type="button" data-faq="${i}" aria-expanded="${state.openFaq === i}">
        <span>${f.q[state.lang]}</span><svg width="19" height="19"><use href="#i-chevron"/></svg>
      </button>
      ${state.openFaq === i ? `<p>${f.a[state.lang]}</p>` : ""}
    </div>`).join("");
}

function renderMethodList() {
  $("#methodList").innerHTML = t().methodPoints
    .map((p) => `<li><span><svg width="14" height="14"><use href="#i-check"/></svg></span>${p}</li>`).join("");
}


function renderFooter() {
  const L = state.lang;
  const ext = '<svg class="ext-icon" width="13" height="13"><use href="#i-external"/></svg>';
  $("#footerLinks").innerHTML = FOOTER_LINKS.map((l) => {
    const attrs = l.external ? 'target="_blank" rel="noreferrer"' : l.action ? `data-action="${l.action}"` : "";
    return `<li><a href="${l.href}" ${attrs}>${l.label[L]}${l.external ? ext : ""}</a></li>`;
  }).join("");

  const rows = [`<li class="contact-address"><svg width="16" height="16"><use href="#i-pin"/></svg><span>${CONTACT.address[L]}</span></li>`];
  if (CONTACT.phone) rows.push(`<li><svg width="16" height="16"><use href="#i-phone"/></svg><span>${t().phoneLabel}: <a dir="ltr" href="tel:${CONTACT.phone.replace(/\s/g, "")}">${CONTACT.phone}</a></span></li>`);
  if (CONTACT.email) rows.push(`<li><svg width="16" height="16"><use href="#i-mail"/></svg><span>${t().emailLabel}: <a href="mailto:${CONTACT.email}">${CONTACT.email}</a></span></li>`);
  if (CONTACT.hours[L]) rows.push(`<li><svg width="16" height="16"><use href="#i-book"/></svg><span>${t().hoursLabel}: ${CONTACT.hours[L]}</span></li>`);
  rows.push(`<li class="contact-details"><a href="${LINKS.contact}" target="_blank" rel="noreferrer">${t().detailsLink}${ext}</a></li>`);
  $("#footerContact").innerHTML = rows.join("");
}

/* بيملى كل العناصر اللي عليها data-i18n */
function renderStaticText() {
  $$("[data-i18n]").forEach((el) => { el.textContent = lookup(el.dataset.i18n); });
  $$("[data-i18n-lines]").forEach((el) => {
    el.innerHTML = lookup(el.dataset.i18nLines).split("\n").map((line) => `<span>${line}</span>`).join("");
  });
  $$(".lang-label-long").forEach((el) => (el.textContent = t().langLong));
  $$(".lang-label-short").forEach((el) => (el.textContent = t().langShort));
}

function renderAll() {
  const isAr = state.lang === "ar";
  document.documentElement.lang = state.lang;
  document.documentElement.dir = isAr ? "rtl" : "ltr";
  document.title = t().title;
  renderStaticText();
  renderMethodList();
  renderFaqs();
  renderFooter();
}

/* ---------- 7) التفاعلات ---------- */
let toastTimer;
function showToast(message) {
  $("#toastText").textContent = message;
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ($("#toast").hidden = true), 3200);
}

function openContact() {
  showToast(t().toast);
  window.open(LINKS.contact, "_blank", "noopener,noreferrer");
}

function setMenu(open) {
  $("#mainNav").classList.toggle("is-open", open);
  $("#menuIcon").setAttribute("href", open ? "#i-x" : "#i-menu");
}

function toggleLanguage() {
  state.lang = state.lang === "ar" ? "en" : "ar";
  setMenu(false);
  renderAll();
}

/* نستخدم Event delegation عشان العناصر اللي بتتولد بالـ JS تشتغل برضه */
document.addEventListener("click", (e) => {
  const target = e.target.closest("button, a");
  if (!target) return;

  if (target.dataset.action === "cookies") {
    e.preventDefault();
    $("#cookieBar").hidden = false;
    $("#cookiePanel").hidden = false;
    return;
  }
  if (target.dataset.cookie) return handleCookie(target.dataset.cookie);
  if (target.id === "cookieManage") { $("#cookiePanel").hidden = !$("#cookiePanel").hidden; return; }

  if (target.classList.contains("js-cta")) return openContact();
  if (target.classList.contains("js-lang")) return toggleLanguage();

  if (target.classList.contains("js-scroll")) {
    return document.getElementById(target.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  if (target.id === "menuToggle") return setMenu(!$("#mainNav").classList.contains("is-open"));
  if (target.closest("#mainNav") && target.tagName === "A") return setMenu(false);

  if (target.dataset.faq !== undefined) {
    const i = Number(target.dataset.faq);
    state.openFaq = state.openFaq === i ? null : i;
    return renderFaqs();
  }
});


/* ---------- شريط الكوكيز ---------- */
const COOKIE_KEY = "lts-cookie-consent";
const cookieStore = {
  get() { try { return localStorage.getItem(COOKIE_KEY); } catch { return null; } },
  set(v) { try { localStorage.setItem(COOKIE_KEY, v); } catch { /* التخزين مش متاح */ } },
};
function closeCookieBar(choice) {
  if (choice) cookieStore.set(JSON.stringify(choice));
  $("#cookieBar").hidden = true;
}
function handleCookie(action) {
  if (action === "accept") closeCookieBar({ analytics: true, marketing: true });
  else if (action === "reject") closeCookieBar({ analytics: false, marketing: false });
  else if (action === "save") closeCookieBar({ analytics: $("#ckAnalytics").checked, marketing: $("#ckMarketing").checked });
  else closeCookieBar(); // زرار الإغلاق: بيخفي الشريط من غير ما يحفظ اختيار
}
if (!cookieStore.get()) $("#cookieBar").hidden = false;

/* ---------- 8) تشغيل ---------- */
$("#googleLink").href = LINKS.reviews;
$("#facebookLink").href = LINKS.facebook;
$("#instagramLink").href = LINKS.instagram;
$("#ctaLink").href = LINKS.contact;
$("#footerFacebook").href = LINKS.facebook;
$("#footerInstagram").href = LINKS.instagram;
renderAll();

</script>
